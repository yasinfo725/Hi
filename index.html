<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্মার্ট মোশন ডিটেক্টর</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 5px;
        }
        header p {
            color: #94a3b8;
            font-size: 14px;
        }
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #334155;
            background-color: #000;
            aspect-ratio: 4/3;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .status-box {
            margin-top: 15px;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            background-color: #1e293b;
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }
        .motion-detected {
            background-color: #dc2626 !important;
            color: #ffffff !important;
            border-color: #f87171 !important;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.6);
        }
        .controls {
            margin-top: 15px;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #1e293b;
            padding: 15px;
            border-radius: 10px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.8;
        }
        #startBtn {
            background-color: #10b981;
            color: white;
        }
        #stopBtn {
            background-color: #ef4444;
            color: white;
            display: none;
        }
        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .slider-container label {
            font-size: 14px;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #38bdf8;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <header>
        <h1>MOTION DETECTOR PRO</h1>
        <p>রিয়েল-টাইম নড়াচড়া শনাক্তকরণ সিস্টেম</p>
    </header>

    <div class="camera-container" id="camBox">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlayCanvas"></canvas>
    </div>

    <div class="status-box" id="statusBox">ক্যামেরা বন্ধ আছে</div>

    <div class="controls">
        <div class="btn-group">
            <button id="startBtn">ক্যামেরা চালু করুন</button>
            <button id="stopBtn">ক্যামেরা বন্ধ করুন</button>
        </div>

        <div class="slider-container">
            <label for="sensitivity">
                <span>সংবেদনশীলতা (Sensitivity):</span>
                <span id="sensValue">মাঝারি (25)</span>
            </label>
            <!-- মান যত কম হবে, সামান্য নড়াচড়াও তত বেশি ধরবে -->
            <input type="range" id="sensitivity" min="5" max="80" value="25">
        </div>

        <div class="checkbox-container">
            <input type="checkbox" id="soundAlert" checked>
            <label for="soundAlert">নড়াচড়া ধরলে অ্যালার্ম সাউন্ড বাজবে</label>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const overlayCtx = overlayCanvas.getContext('2d');
        const statusBox = document.getElementById('statusBox');
        const camBox = document.getElementById('camBox');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const sensitivitySlider = document.getElementById('sensitivity');
        const sensValueText = document.getElementById('sensValue');
        const soundAlertCheckbox = document.getElementById('soundAlert');

        // প্রসেসিংয়ের জন্য অফ-স্ক্রিন ক্যানভাস (ছোট রেজোলিউশনে দ্রুত কাজ করার জন্য)
        const processCanvas = document.createElement('canvas');
        const processCtx = processCanvas.getContext('2d', { willReadFrequently: true });
        const procWidth = 80;
        const procHeight = 60;
        processCanvas.width = procWidth;
        processCanvas.height = procHeight;

        let stream = null;
        let isRunning = false;
        let previousFrameData = null;
        let animationId = null;
        let audioCtx = null;
        let lastBeepTime = 0;

        // সংবেদনশীলতা স্লাইডার আপডেট
        sensitivitySlider.addEventListener('input', (e) => {
            const val = e.target.value;
            let label = 'মাঝারি';
            if (val < 18) label = 'অতি সংবেদনশীল';
            else if (val > 45) label = 'কম সংবেদনশীল';
            sensValueText.textContent = `${label} (${val})`;
        });

        // অ্যালার্ম বীপ সাউন্ড তৈরি (কোনো অডিও ফাইল ছাড়াই)
        function playBeep() {
            if (!soundAlertCheckbox.checked) return;
            const now = Date.now();
            if (now - lastBeepTime < 600) return; // প্রতি ০.৬ সেকেন্ড পরপর বীপ
            lastBeepTime = now;

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // 880Hz টোন
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.15);
        }

        // ক্যামেরা চালু করা
        startBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }, // ফোনের পেছনের ক্যামেরা ব্যবহার করবে
                    audio: false
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    overlayCanvas.width = video.videoWidth;
                    overlayCanvas.height = video.videoHeight;
                    isRunning = true;
                    previousFrameData = null;
                    startBtn.style.display = 'none';
                    stopBtn.style.display = 'block';
                    statusBox.textContent = 'স্ক্যান চলছে... কোনো নড়াচড়া নেই';
                    detectMotion();
                };
            } catch (err) {
                alert('ক্যামেরা চালু করা যায়নি! পারমিশন চেক করুন।');
                console.error(err);
            }
        });

        // ক্যামেরা বন্ধ করা
        stopBtn.addEventListener('click', () => {
            isRunning = false;
            if (animationId) cancelAnimationFrame(animationId);
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            video.srcObject = null;
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            startBtn.style.display = 'block';
            stopBtn.style.display = 'none';
            statusBox.classList.remove('motion-detected');
            camBox.style.borderColor = '#334155';
            statusBox.textContent = 'ক্যামেরা বন্ধ আছে';
        });

        // মূল মোশন ডিটেকশন লজিক
        function detectMotion() {
            if (!isRunning) return;

            processCtx.drawImage(video, 0, 0, procWidth, procHeight);
            const currentFrame = processCtx.getImageData(0, 0, procWidth, procHeight);
            const currentData = currentFrame.data;

            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

            if (previousFrameData) {
                const threshold = parseInt(sensitivitySlider.value, 10);
                let changedPixels = 0;

                // নড়াচড়ার সীমানা (Bounding Box) নির্ণয়ের ভেরিয়েবল
                let minX = procWidth, minY = procHeight, maxX = 0, maxY = 0;

                for (let y = 0; y < procHeight; y++) {
                    for (let x = 0; x < procWidth; x++) {
                        const i = (y * procWidth + x) * 4;

                        // RGB কালারের পার্থক্য হিসাব করা
                        const rDiff = Math.abs(currentData[i] - previousFrameData[i]);
                        const gDiff = Math.abs(currentData[i + 1] - previousFrameData[i + 1]);
                        const bDiff = Math.abs(currentData[i + 2] - previousFrameData[i + 2]);

                        const avgDiff = (rDiff + gDiff + bDiff) / 3;

                        if (avgDiff > threshold) {
                            changedPixels++;
                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;
                        }
                    }
                }

                // ন্যূনতম ১৫টি পিক্সেল পরিবর্তন হলে নড়াচড়া হিসেবে ধরা হবে (নয়েজ এড়াতে)
                if (changedPixels > 15) {
                    statusBox.textContent = '⚠️ সতর্কতা: নড়াচড়া শনাক্ত হয়েছে!';
                    statusBox.classList.add('motion-detected');
                    camBox.style.borderColor = '#ef4444';
                    playBeep();

                    // নড়াচড়া হওয়া জায়গায় লাল বক্স আঁকা
                    const scaleX = overlayCanvas.width / procWidth;
                    const scaleY = overlayCanvas.height / procHeight;

                    const boxX = minX * scaleX;
                    const boxY = minY * scaleY;
                    const boxW = (maxX - minX) * scaleX;
                    const boxH = (maxY - minY) * scaleY;

                    overlayCtx.strokeStyle = '#ef4444';
                    overlayCtx.lineWidth = 4;
                    overlayCtx.strokeRect(boxX, boxY, boxW, boxH);

                    overlayCtx.fillStyle = '#ef4444';
                    overlayCtx.font = 'bold 18px sans-serif';
                    overlayCtx.fillText('MOTION', boxX, boxY > 25 ? boxY - 8 : boxY + 20);
                } else {
                    statusBox.textContent = 'স্ক্যান চলছে... কোনো নড়াচড়া নেই';
                    statusBox.classList.remove('motion-detected');
                    camBox.style.borderColor = '#10b981';
                }
            }

            // বর্তমান ফ্রেমটি পরবর্তী ফ্রেমের সাথে তুলনার জন্য সংরক্ষণ করা
            previousFrameData = new Uint8ClampedArray(currentData);

            animationId = requestAnimationFrame(detectMotion);
        }
    </script>
</body>
</html>
