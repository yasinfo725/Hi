<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্মার্ট মোশন অ্যালার্ট ও কল সিস্টেম</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 16px;
        }
        header h1 {
            color: #38bdf8;
            font-size: 22px;
            margin-bottom: 4px;
        }
        header p {
            color: #94a3b8;
            font-size: 13px;
        }
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #334155;
            background-color: #000;
            aspect-ratio: 4/3;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .status-box {
            margin-top: 14px;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            background-color: #1e293b;
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }
        .motion-detected {
            background-color: #dc2626 !important;
            color: #ffffff !important;
            border-color: #f87171 !important;
        }
        .controls {
            margin-top: 14px;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background-color: #1e293b;
            padding: 15px;
            border-radius: 10px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        #startBtn {
            background-color: #10b981;
            color: white;
        }
        #stopBtn {
            background-color: #ef4444;
            color: white;
            display: none;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-group label {
            font-size: 13px;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
        }
        input[type="tel"], input[type="number"] {
            padding: 9px 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #f8fafc;
            font-size: 14px;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #38bdf8;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #cbd5e1;
        }
        .call-link-btn {
            display: none;
            text-align: center;
            padding: 10px;
            background-color: #2563eb;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>MOTION TO CALL PRO</h1>
        <p>৩৩% সংবেদনশীলতায় নড়াচড়া শনাক্ত হলে 01780374791 নম্বরে কল ট্রিগার</p>
    </header>

    <div class="camera-container" id="camBox">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlayCanvas"></canvas>
    </div>

    <div class="status-box" id="statusBox">ক্যামেরা বন্ধ আছে</div>

    <div class="controls">
        <div class="btn-group">
            <button id="startBtn">ক্যামেরা চালু করুন</button>
            <button id="stopBtn">ক্যামেরা বন্ধ করুন</button>
        </div>

        <div class="input-group">
            <label for="targetPhone">যে নম্বরে কল যাবে:</label>
            <input type="tel" id="targetPhone" value="01780374791" placeholder="017XXXXXXXX">
        </div>

        <div class="input-group">
            <label for="sensitivity">
                <span>সংবেদনশীলতা (Sensitivity):</span>
                <span id="sensValue">33%</span>
            </label>
            <input type="range" id="sensitivity" min="1" max="100" value="33">
        </div>

        <div class="input-group">
            <label for="cooldownSec">কল কুলডাউন সময় (সেকেন্ড):</label>
            <input type="number" id="cooldownSec" min="5" max="300" value="30">
        </div>

        <div class="checkbox-container">
            <input type="checkbox" id="autoCallEnabled" checked>
            <label for="autoCallEnabled">নড়াচড়া পেলে অটো কল ট্রিগার সক্রিয় রাখুন</label>
        </div>

        <a id="manualCallFallback" class="call-link-btn" href="tel:01780374791">📞 এখনই কল করুন</a>
    </div>

    <script>
        const video = document.getElementById('video');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const overlayCtx = overlayCanvas.getContext('2d');
        const statusBox = document.getElementById('statusBox');
        const camBox = document.getElementById('camBox');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const targetPhoneInput = document.getElementById('targetPhone');
        const sensitivitySlider = document.getElementById('sensitivity');
        const sensValueText = document.getElementById('sensValue');
        const cooldownInput = document.getElementById('cooldownSec');
        const autoCallCheckbox = document.getElementById('autoCallEnabled');
        const manualCallFallback = document.getElementById('manualCallFallback');

        const processCanvas = document.createElement('canvas');
        const processCtx = processCanvas.getContext('2d', { willReadFrequently: true });
        const procWidth = 80;
        const procHeight = 60;
        processCanvas.width = procWidth;
        processCanvas.height = procHeight;

        let stream = null;
        let isRunning = false;
        let previousFrameData = null;
        let animationId = null;
        let lastCallTime = 0;

        sensitivitySlider.addEventListener('input', (e) => {
            sensValueText.textContent = `${e.target.value}%`;
        });

        function triggerPhoneCall() {
            if (!autoCallCheckbox.checked) return;

            const rawPhone = targetPhoneInput.value.trim();
            const cleanPhone = rawPhone.replace(/[^+\d]/g, '');
            if (!cleanPhone) return;

            const cooldownMs = (parseInt(cooldownInput.value, 10) || 30) * 1000;
            const now = Date.now();

            if (now - lastCallTime < cooldownMs) return;
            lastCallTime = now;

            const telUrl = `tel:${cleanPhone}`;
            manualCallFallback.href = telUrl;
            manualCallFallback.textContent = `📞 কল করুন: ${cleanPhone}`;
            manualCallFallback.style.display = 'block';

            window.location.href = telUrl;
        }

        startBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    overlayCanvas.width = video.videoWidth;
                    overlayCanvas.height = video.videoHeight;
                    isRunning = true;
                    previousFrameData = null;
                    startBtn.style.display = 'none';
                    stopBtn.style.display = 'block';
                    statusBox.textContent = 'স্ক্যান চলছে... কোনো নড়াচড়া নেই';
                    detectMotion();
                };
            } catch (err) {
                alert('ক্যামেরা চালু করা যায়নি! পারমিশন চেক করুন।');
                console.error(err);
            }
        });

        stopBtn.addEventListener('click', () => {
            isRunning = false;
            if (animationId) cancelAnimationFrame(animationId);
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            video.srcObject = null;
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            startBtn.style.display = 'block';
            stopBtn.style.display = 'none';
            statusBox.classList.remove('motion-detected');
            camBox.style.borderColor = '#334155';
            statusBox.textContent = 'ক্যামেরা বন্ধ আছে';
        });

        function detectMotion() {
            if (!isRunning) return;

            processCtx.drawImage(video, 0, 0, procWidth, procHeight);
            const currentFrame = processCtx.getImageData(0, 0, procWidth, procHeight);
            const currentData = currentFrame.data;

            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

            if (previousFrameData) {
                const sensPercent = parseInt(sensitivitySlider.value, 10);
                const pixelDiffThreshold = Math.max(8, Math.round(100 - sensPercent * 0.8));

                let changedPixels = 0;
                let minX = procWidth, minY = procHeight, maxX = 0, maxY = 0;

                for (let y = 0; y < procHeight; y++) {
                    for (let x = 0; x < procWidth; x++) {
                        const i = (y * procWidth + x) * 4;
                        const rDiff = Math.abs(currentData[i] - previousFrameData[i]);
                        const gDiff = Math.abs(currentData[i + 1] - previousFrameData[i + 1]);
                        const bDiff = Math.abs(currentData[i + 2] - previousFrameData[i + 2]);
                        const avgDiff = (rDiff + gDiff + bDiff) / 3;

                        if (avgDiff > pixelDiffThreshold) {
                            changedPixels++;
                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;
                        }
                    }
                }

                if (changedPixels > 20) {
                    statusBox.textContent = '⚠️ নড়াচড়া শনাক্ত হয়েছে! কল ট্রিগার হচ্ছে...';
                    statusBox.classList.add('motion-detected');
                    camBox.style.borderColor = '#ef4444';

                    const scaleX = overlayCanvas.width / procWidth;
                    const scaleY = overlayCanvas.height / procHeight;

                    overlayCtx.strokeStyle = '#ef4444';
                    overlayCtx.lineWidth = 4;
                    overlayCtx.strokeRect(
                        minX * scaleX,
                        minY * scaleY,
                        (maxX - minX) * scaleX,
                        (maxY - minY) * scaleY
                    );

                    triggerPhoneCall();
                } else {
                    statusBox.textContent = 'স্ক্যান চলছে... কোনো নড়াচড়া নেই';
                    statusBox.classList.remove('motion-detected');
                    camBox.style.borderColor = '#10b981';
                }
            }

            previousFrameData = new Uint8ClampedArray(currentData);
            animationId = requestAnimationFrame(detectMotion);
        }
    </script>
</body>
</html>
